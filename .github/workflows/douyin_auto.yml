name: 抖音自动更新

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

# 关键：授予最大的写权限
permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码 (带 Token)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # 拉取全部历史，避免冲突

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip

      - name: 运行脚本
        run: python3 update_m3u.py

      - name: 强制提交推送
        run: |
          # 配置用户信息
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加文件
          git add douyin_live.m3u
          
          # 检查是否有变动
          if git diff --staged --quiet; then
            echo "没有文件变动，跳过提交"
            exit 0
          fi
          
          # 拉取最新远程代码并变基，避免冲突
          git pull origin main --rebase || true
          
          # 提交
          git commit -m "自动更新抖音源 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          
          # 强制推送（解决权限和冲突问题）
          git push origin HEAD:main --force
