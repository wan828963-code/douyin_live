name: Kuaishou Live Update

on:
  schedule:
    - cron: '0 * * * *'   # 每小时更新一次
  workflow_dispatch:       # 也可以手动点

jobs:
  update:
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 运行更新脚本
        run: python3 update_m3u.py
      
      - name: 提交推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kuaishou_live.m3u
          git diff --staged --quiet || (git commit -m "Auto update: $(date '+%Y-%m-%d %H:%M')" && git push)
